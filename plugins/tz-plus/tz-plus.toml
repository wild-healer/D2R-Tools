# TZ Plus
#
# Nightmare: one whole act is a terror zone, the act changing every 30 minutes.
# Hell: every level is a terror zone, up to level 99.
# The mods roll once per game. Changes apply from the next game.

[tz-plus]
enabled = true
nightmare = true
hell = true

# The game's mods and rewards on screen, in a terror zone.
# show_x: right edge, show_y: top, as a share of the screen (0 to 1).
show_mods = true
show_x = 0.99
show_y = 0.10
show_size = 1.00

# Mods that can roll
extra_strong = true
extra_fast = true
cursed = true
magic_resistant = true
fire_enchanted = true
lightning_enchanted = true
cold_enchanted = true
venomous = true
mana_burn = true
teleportation = true
spectral_hit = true
stone_skin = true
multiple_shots = true
tough = true
vampiric = true
regenerating = true
might = true
holy_fire = true
blessed_aim = true
holy_freeze = true
conviction = true
fanaticism = true
holy_shock = true
concentration = true
vigor = true
thorns = true
