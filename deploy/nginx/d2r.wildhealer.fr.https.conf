# /etc/nginx/conf.d/d2r.wildhealer.fr.conf  (HTTPS variant, removes the "Not secure" label)
# Serves grail.html at / and nothing else; every other path redirects to /.
#
# Fedora setup: do the HTTP config's setup first and check it works, then:
#   sudo dnf install certbot python3-certbot-nginx
#   sudo firewall-cmd --permanent --add-service=https && sudo firewall-cmd --reload
#   sudo certbot certonly --nginx -d d2r.wildhealer.fr
#   # replace the HTTP config with this file
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl enable --now certbot-renew.timer   # auto-renewal

server {
    listen 80;
    listen [::]:80;
    server_name d2r.wildhealer.fr;
    return 301 https://$host/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name d2r.wildhealer.fr;

    ssl_certificate     /etc/letsencrypt/live/d2r.wildhealer.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d2r.wildhealer.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/fedora/D2R-Tools;
    charset utf-8;
    server_tokens off;

    location = / {
        try_files /grail.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        return 302 /;
    }

    gzip on;
    gzip_min_length 1024;
}
