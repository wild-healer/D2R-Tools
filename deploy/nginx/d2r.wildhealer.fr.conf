# /etc/nginx/conf.d/d2r.wildhealer.fr.conf
# Plain-HTTP site for d2r.wildhealer.fr: serves grail.html at / and nothing else.
# Every other path (including /grail.html and the repo's .git) redirects to /.
#
# Fedora setup (repo checked out at /home/fedora/D2R-Tools):
#   sudo dnf install nginx
#   # let the nginx user traverse the home dir and read the file
#   chmod o+x /home/fedora /home/fedora/D2R-Tools && chmod o+r /home/fedora/D2R-Tools/grail.html
#   # SELinux: label the file as web content
#   sudo semanage fcontext -a -t httpd_sys_content_t "/home/fedora/D2R-Tools/grail\.html"
#   sudo restorecon -v /home/fedora/D2R-Tools/grail.html
#   sudo firewall-cmd --permanent --add-service=http && sudo firewall-cmd --reload
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# After a `git pull`, run the restorecon line again if the file was replaced.

server {
    listen 80;
    listen [::]:80;
    server_name d2r.wildhealer.fr;

    root /home/fedora/D2R-Tools;
    charset utf-8;
    server_tokens off;

    location = / {
        try_files /grail.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        return 302 /;
    }

    gzip on;
    gzip_min_length 1024;
}
